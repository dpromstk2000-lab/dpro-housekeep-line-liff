name: "DPRO SHOP Fix 12 HOUSEKEEP"
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/dpro-shop-fix-12-housekeep.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dpro-shop-fix-12-housekeep"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited source SHA
        shell: bash
        run: |
          set -euo pipefail
          check() {
            path="$1"; expected="$2"
            test -f "$path" || { echo "Missing target: $path"; exit 31; }
            got="$(git hash-object "$path")"
            echo "$path  $got"
            test "$got" = "$expected" || { echo "SOURCE SHA MISMATCH: $path expected=$expected got=$got"; exit 32; }
          }
          check 'owner.html' '375b30ff0f32ff7d4db6d8a857df5b55e249ddef'

      - name: Apply narrow confirmed fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          
          def read(path):
              return Path(path).read_text(encoding="utf-8")
          
          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          
          def replace_once(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {n}")
              return text.replace(old,new,1)
          
          def sub_once(text, pattern, repl, label, flags=0):
              new,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {n}")
              return new
          
          p='owner.html'; t=read(p)
          t=replace_once(t,
          '''async function saveBooking(){const body={booking_id:currentBooking.id,status:$('editStatus').value,staff_id:$('editStaff').value||null,estimated_amount:$('editEstimate').value===''?null:Number($('editEstimate').value),final_amount:$('editFinal').value===''?null:Number($('editFinal').value),payment_status:$('editPayment').value,parking_cost:Number($('editParking').value||0),internal_note:$('editNote').value};load(true,'予約を保存しています…');''',
          '''async function saveBooking(){const body={booking_id:currentBooking.id,status:$('editStatus').value,staff_id:$('editStaff').value||null,estimated_amount:$('editEstimate').value===''?null:Number($('editEstimate').value),final_amount:$('editFinal').value===''?null:Number($('editFinal').value),payment_status:$('editPayment').value,parking_cost:Number($('editParking').value||0),internal_note:$('editNote').value};const terminalBooking=body.status!==currentBooking.status&&['completed','cancelled','no_show'].includes(body.status),terminalPayment=body.payment_status!==currentBooking.payment_status&&['paid','refunded','not_required'].includes(body.payment_status);if((terminalBooking||terminalPayment)&&!confirm('完了・取消・入金/返金などの重要状態を保存しますか？'))return;load(true,'予約を保存しています…');''','HOUSEKEEP booking/payment guard')
          t=replace_once(t,
          '''status:$('cStatus').value,key_handling:$('cKeyHandling').value,key_note:$('cKeyNote').value,internal_note:$('cInternalNote').value,service_details:''',
          '''status:$('cStatus').value,key_handling:$('cKeyHandling').value,key_note:$('cKeyNote').value,internal_note:$('cInternalNote').value,service_details:''','HOUSEKEEP contract anchor')
          # Insert guard immediately before load in saveContract, scoped by function block.
          t=sub_once(t,r'''(async function saveContract\(\)\{.*?const body=\{.*?\};)(load\(true,'定期契約を保存しています…'\);)''', r'''\1if(currentContract&&body.status==='ended'&&body.status!==currentContract.status&&!confirm('この定期契約を終了状態へ変更しますか？'))return;\2''','HOUSEKEEP contract ended guard',flags=re.S)
          write(p,t)
          PY

      - name: Validate source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- "owner.html"
          if git diff --quiet -- "owner.html"; then
            echo "No source change was produced."
            exit 41
          fi

      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "owner.html"
          git diff --cached --check
          git commit -m "Fix housekeep terminal/payment guards"
          git push origin HEAD:main
