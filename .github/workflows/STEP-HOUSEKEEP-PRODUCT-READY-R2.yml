name: DPRO HOUSEKEEP Product Ready R2 Browser Recheck

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-HOUSEKEEP-PRODUCT-READY-R2.yml'

permissions:
  contents: write

concurrency:
  group: dpro-housekeep-product-ready-r2
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify prior Gateway QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          g=json.load(open('product-ready-evidence/housekeep-r2/gateway-qa.json'))
          assert g['ok'] is True and g['failed'] == 0 and g['passed'] == g['total']
          print('GATEWAY_PRIOR_EVIDENCE=PASS', g['passed'], '/', g['total'])
          PY

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/housekeep-browser
          cd /tmp/housekeep-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run fresh browser matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/housekeep-browser/qa.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'fs';
          const BASE='https://dpromstk2000-lab.github.io/dpro-housekeep-line-liff';
          const cases=[
            {name:'customer_390',path:'/index.html?demo=1',w:390,h:844,ready:()=>document.querySelectorAll('#services input').length>0},
            {name:'customer_320',path:'/index.html?demo=1',w:320,h:720,ready:()=>document.querySelectorAll('#services input').length>0},
            {name:'member_390',path:'/member.html?phone=090-1111-2401',w:390,h:844,ready:()=>!document.querySelector('#member')?.classList.contains('hidden')},
            {name:'owner_pc',path:'/owner.html?demo=1',w:1440,h:1000,ready:()=>getComputedStyle(document.querySelector('#login')).display==='none'},
            {name:'staff_ipad',path:'/staff.html?demo=1',w:1024,h:768,ready:()=>getComputedStyle(document.querySelector('#login')).display==='none'},
            {name:'system_check_pc',path:'/system-check.html?demo=1',w:1440,h:1000,ready:()=>document.querySelector('#statusTitle')?.textContent.includes('正常')}
          ];
          const browser=await chromium.launch({headless:true}),results=[];
          fs.mkdirSync('product-ready-evidence/housekeep-r2/screenshots',{recursive:true});
          for(const c of cases){
            const page=await browser.newPage({viewport:{width:c.w,height:c.h}}),errs=[];
            page.on('pageerror',e=>errs.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errs.push('console:'+m.text())});
            let status=0,ready=false,evald={};
            try{
              const res=await page.goto(BASE+c.path,{waitUntil:'domcontentloaded',timeout:45000}); status=res?.status()||0;
              try{await page.waitForFunction(c.ready,{timeout:20000})}catch{}
              await page.waitForTimeout(1500); ready=await page.evaluate(c.ready);
              evald=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth,bodyText:(document.body?.innerText||'').slice(0,4000),api:window.DPRO_HOUSEKEEP_CONFIG?.API_BASE||'',version:window.DPRO_HOUSEKEEP_CONFIG?.VERSION||''}));
              await page.screenshot({path:`product-ready-evidence/housekeep-r2/screenshots/${c.name}.png`,fullPage:true});
            }catch(e){errs.push('goto:'+e.message)}
            const technical=/TypeError|ReferenceError|Failed to fetch|通信に失敗しました|管理コードが正しくありません/.test(evald.bodyText||'');
            const expected401='console:Failed to load resource: the server responded with a status of 401 ()';
            const effectiveErrs=errs.filter(e=>!(c.name==='system_check_pc'&&e===expected401));
            const ok=status===200&&ready&&evald.scrollWidth<=evald.innerWidth+1&&!technical&&effectiveErrs.length===0&&evald.api.includes('dpro-housekeep-product-ready-v2')&&evald.version==='HOUSEKEEP-8-PR2-FRONTEND-20260824';
            results.push({name:c.name,ok,status,ready,viewport:[c.w,c.h],innerWidth:evald.innerWidth,scrollWidth:evald.scrollWidth,api:evald.api,version:evald.version,technical,errors:errs,ignoredExpected401:c.name==='system_check_pc'&&errs.includes(expected401)});
            console.log(`${ok?'PASS':'FAIL'} ${c.name}`,results.at(-1)); await page.close();
          }
          await browser.close();
          const summary={ok:results.every(x=>x.ok),checkedAt:new Date().toISOString(),base:BASE,total:results.length,passed:results.filter(x=>x.ok).length,failed:results.filter(x=>!x.ok).length,results};
          fs.writeFileSync('product-ready-evidence/housekeep-r2/browser-qa.json',JSON.stringify(summary,null,2)+'\n');
          if(!summary.ok) process.exitCode=2;
          JS
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/housekeep-browser/node_modules node /tmp/housekeep-browser/qa.mjs

      - name: Rebuild QA summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path('product-ready-evidence/housekeep-r2')
          g=json.load(open(p/'gateway-qa.json')); b=json.load(open(p/'browser-qa.json'))
          out={'product':'HOUSEKEEP','audit_sequence':2,'gateway':g,'browser':b,'ok':bool(g.get('ok')) and bool(b.get('ok')),'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'final_lock_self_confirm':False,'qa_note':'system-check intentionally exercises invalid Owner auth; its expected HTTP 401 console resource message is recorded but excluded from browser blocking errors'}
          assert out['ok'] is True
          (p/'qa-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('QA_SUMMARY=PASS')
          PY

      - name: Commit corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name 'dpro-product-ready-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add product-ready-evidence/housekeep-r2
          if ! git diff --cached --quiet; then
            git commit -m 'Correct HOUSEKEEP R2 browser QA expected 401 classification'
            git push
          fi

      - name: Final gate and self cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          q=json.load(open('product-ready-evidence/housekeep-r2/qa-summary.json'))
          assert q['ok'] is True and q['gateway']['failed'] == 0 and q['browser']['failed'] == 0
          PY
          git pull --rebase
          git rm -f .github/workflows/STEP-HOUSEKEEP-PRODUCT-READY-R2.yml
          git config user.name 'dpro-product-ready-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Complete HOUSEKEEP Product Ready R2 live gate'
          git push
