name: DPRO HOUSEKEEP Product Ready R2 Finalize

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-HOUSEKEEP-PRODUCT-READY-R2.yml'

permissions:
  contents: write

concurrency:
  group: dpro-housekeep-product-ready-r2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R1 source ancestor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fb7164e94f6ba9aaeb1db843110efb1b208e79db HEAD
          test -f config.js
          grep -F 'dpro-housekeep-line-api.dpromstk2000.workers.dev' config.js
          echo R1_SOURCE_ANCESTOR=PASS

      - name: Apply R2 frontend bridge and retain formal source
        shell: bash
        run: |
          mkdir -p "$(dirname 'config.js')"
          echo '' | base64 -d > 'config.js'
          mkdir -p "$(dirname 'product-ready/housekeep-r2/DB_R2_SCHEMA.sql')"
          echo '' | base64 -d > 'product-ready/housekeep-r2/DB_R2_SCHEMA.sql'
          mkdir -p "$(dirname 'product-ready/housekeep-r2/EDGE_GATEWAY_R2_core.ts')"
          echo '' | base64 -d > 'product-ready/housekeep-r2/EDGE_GATEWAY_R2_core.ts'
          mkdir -p "$(dirname 'product-ready/housekeep-r2/EDGE_GATEWAY_R2_auth.ts')"
          echo '' | base64 -d > 'product-ready/housekeep-r2/EDGE_GATEWAY_R2_auth.ts'
          mkdir -p "$(dirname 'product-ready/housekeep-r2/EDGE_GATEWAY_R2_index.ts')"
          echo '' | base64 -d > 'product-ready/housekeep-r2/EDGE_GATEWAY_R2_index.ts'
          mkdir -p "$(dirname 'product-ready/housekeep-r2/RUNTIME_CONTRACT_R2.json')"
          echo '' | base64 -d > 'product-ready/housekeep-r2/RUNTIME_CONTRACT_R2.json'
          cat > product-ready/housekeep-r2/DEPLOYED_EDGE_FINGERPRINT.txt <<'EOF'
          function=dpro-housekeep-product-ready-v2
          function_id=07218044-e936-422f-9d0f-3c6a2cad2c68
          deployed_version=4
          ezbr_sha256=8b13228745b9b43bfe0783a37b8c3a55042d70ab1ef79d50e159806eafeeb4f1
          supabase_project=cbknucemarcpbscirzyv
          EOF
          node --check config.js
          grep -F 'HOUSEKEEP-8-PR2-FRONTEND-20260824' config.js
          grep -F 'dpro-housekeep-product-ready-v2' config.js
          grep -F 'deferred_until_contract' product-ready/housekeep-r2/EDGE_GATEWAY_R2_core.ts
          grep -F 'client staff_id is not authoritative' product-ready/housekeep-r2/EDGE_GATEWAY_R2_index.ts

      - name: Commit R2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dpro-product-ready-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js product-ready/housekeep-r2
          if ! git diff --cached --quiet; then
            git commit -m 'Apply HOUSEKEEP Product Ready R2 security runtime'
            git push
          fi
          git rev-parse HEAD | tee /tmp/r2_source_head

      - name: Wait for GitHub Pages source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-housekeep-line-liff/config.js'
          for i in $(seq 1 40); do
            if curl -fsSL "$URL?qa=$GITHUB_SHA-$i" | grep -Fq 'HOUSEKEEP-8-PR2-FRONTEND-20260824'; then
              echo PAGES_R2_SOURCE=PASS
              exit 0
            fi
            sleep 10
          done
          echo 'GitHub Pages did not expose R2 config in the QA window.' >&2
          exit 2

      - name: Run live Gateway and public URL matrix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/housekeep-gateway-qa.mjs
          set +e
          node /tmp/housekeep-gateway-qa.mjs
          rc=$?
          set -e
          echo "GATEWAY_QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/housekeep-browser
          cd /tmp/housekeep-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run fresh browser matrix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/housekeep-browser/qa.mjs
          cd "$GITHUB_WORKSPACE"
          set +e
          NODE_PATH=/tmp/housekeep-browser/node_modules node /tmp/housekeep-browser/qa.mjs
          rc=$?
          set -e
          echo "BROWSER_QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Build QA summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/housekeep-r2
          cp /tmp/r2_source_head product-ready-evidence/housekeep-r2/source-head.txt 2>/dev/null || git rev-parse HEAD > product-ready-evidence/housekeep-r2/source-head.txt
          python3 - <<'PY2'
          import json,os,pathlib,datetime
          p=pathlib.Path('product-ready-evidence/housekeep-r2')
          def rd(n):
            f=p/n
            if not f.exists(): return {'ok':False,'missing':str(f)}
            return json.loads(f.read_text())
          g=rd('gateway-qa.json'); b=rd('browser-qa.json')
          out={'product':'HOUSEKEEP','audit_sequence':2,'gateway':g,'browser':b,'ok':bool(g.get('ok')) and bool(b.get('ok')),'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'final_lock_self_confirm':False}
          (p/'qa-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'ok':out['ok'],'gateway':g.get('passed'),'browser':b.get('passed')},indent=2))
          PY2

      - name: Commit R2 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name 'dpro-product-ready-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add product-ready-evidence/housekeep-r2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish HOUSEKEEP Product Ready R2 live QA evidence'
            git push
          fi

      - name: Final gate and self cleanup
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GATEWAY_QA_EXIT:-99}" != '0' ] || [ "${BROWSER_QA_EXIT:-99}" != '0' ]; then
            echo 'HOUSEKEEP R2 live QA has blocking failures. Workflow is preserved.' >&2
            exit 2
          fi
          python3 - <<'PY3'
          import json
          q=json.load(open('product-ready-evidence/housekeep-r2/qa-summary.json'))
          assert q['ok'] is True
          PY3
          git pull --rebase
          git rm -f .github/workflows/STEP-HOUSEKEEP-PRODUCT-READY-R2.yml
          git config user.name 'dpro-product-ready-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Complete HOUSEKEEP Product Ready R2 live gate'
          git push
