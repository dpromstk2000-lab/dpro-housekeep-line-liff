name: DPRO HOUSEKEEP R2 V5 Source Sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-HOUSEKEEP-PRODUCT-READY-R2-V5-SYNC.yml'

permissions:
  contents: write

concurrency:
  group: dpro-housekeep-r2-v5-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deployed v5 source and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > product-ready/housekeep-r2/EDGE_GATEWAY_R2_auth.ts
          echo '' | base64 -d > product-ready/housekeep-r2/DEPLOYED_EDGE_FINGERPRINT.txt
          grep -F "actor_type:actor" product-ready/housekeep-r2/EDGE_GATEWAY_R2_auth.ts
          grep -F "'staff_session_revoked','staff'" product-ready/housekeep-r2/EDGE_GATEWAY_R2_auth.ts
          grep -F "deployed_version=5" product-ready/housekeep-r2/DEPLOYED_EDGE_FINGERPRINT.txt

      - name: Live v5 staff issue revoke probe
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-housekeep-product-ready-v2'
          COMPANY='dpro_housekeep_demo'
          STAFF_ID='091c0db5-5117-4ba5-bb5a-e680dca3eb06'

          curl -fsS "$BASE/api/health?company_code=$COMPANY" > /tmp/health.json
          node -e "const d=require('/tmp/health.json'); if(!d.ok||d.version!=='HOUSEKEEP-8-PR2-GATEWAY-20260824'||!d.versionsAligned) process.exit(2)"

          curl -fsS -X POST "$BASE/api/staff/session?company_code=$COMPANY&admin_key=1234"             -H 'content-type: application/json'             -H 'x-admin-key: 1234'             --data '{"staff_id":"'$STAFF_ID'"}' > /tmp/issue.json

          TOKEN="$(node -e "const d=require('/tmp/issue.json'); if(!d.ok||!d.session_token) process.exit(2); process.stdout.write(d.session_token)")"

          curl -fsS -X POST "$BASE/api/staff/session/revoke?company_code=$COMPANY"             -H "x-staff-session: $TOKEN" > /tmp/revoke.json
          node -e "const d=require('/tmp/revoke.json'); if(!d.ok||d.revoked!==true) process.exit(2)"

          STATUS="$(curl -sS -o /tmp/revoked.json -w '%{http_code}' "$BASE/api/staff/capability?company_code=$COMPANY" -H "x-staff-session: $TOKEN")"
          test "$STATUS" = '401'

          mkdir -p product-ready-evidence/housekeep-r2
          node <<'JS'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const i=JSON.parse(fs.readFileSync('/tmp/issue.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/revoke.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/revoked.json','utf8'));
          const out={
            product:'HOUSEKEEP',
            audit_sequence:2,
            probe:'R2_V5_STAFF_REVOKE_AUDIT_FIX',
            checked_at:new Date().toISOString(),
            edge_version:5,
            edge_ezbr_sha256:'6101bc94c8e1b851c68aec842cfc1d1c254ab4387da2f70042c19f641e4c9b43',
            health:{ok:h.ok,version:h.version,versionsAligned:h.versionsAligned},
            issue:{ok:i.ok,staff_id:i.staff?.id,role:i.staff?.role,server_authority:i.server_authority===true},
            revoke:{ok:r.ok,revoked:r.revoked===true},
            revoked_session_rejected:{status:401,ok:x.ok===false},
            session_token_persisted:false
          };
          fs.writeFileSync('product-ready-evidence/housekeep-r2/v5-staff-revoke-probe.json',JSON.stringify(out,null,2)+'\n');
          JS

      - name: Commit v5 source sync and self cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dpro-product-ready-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add product-ready/housekeep-r2/EDGE_GATEWAY_R2_auth.ts
          git add product-ready/housekeep-r2/DEPLOYED_EDGE_FINGERPRINT.txt
          git add product-ready-evidence/housekeep-r2/v5-staff-revoke-probe.json
          git rm -f .github/workflows/STEP-HOUSEKEEP-PRODUCT-READY-R2-V5-SYNC.yml
          git commit -m 'Sync HOUSEKEEP R2 Gateway v5 audit fix'
          git push
